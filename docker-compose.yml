services:
  bot:
    container_name: tdlist-bot
    build: .
#    working_dir: app/tg_bot
    volumes:
      - .:/usr/src/app/bot
    environment:
      - TZ=America/Adak
    command: python bot.py
    restart: always
    depends_on:
      - db
      - redis
      - web
    env_file: .env

  web:
    container_name: tdlist-web
    build: .
    volumes:
      - .:/app/
    environment:
      - TZ=America/Adak
    entrypoint: ["/app/wait_for_migrations.sh"]
    command: sh -c "python manage.py create_bot_user && python manage.py runserver 0.0.0.0:8000"
    ports:
      - 8000:8000
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    env_file: .env

  db:
    image: postgres:15.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    container_name: db
    environment:
      - TZ=America/Adak
    env_file: .env
    ports:
      - 5439:5432
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    container_name: tdlist-redis
    image: redis:7.2-rc3-alpine
    restart: always
    environment:
      - TZ=America/Adak
    env_file:
      - .env
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    expose:
      - ${REDIS_PORT}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf


  celery:
    build: .
    entrypoint: ["/app/wait_for_migrations.sh"]
    command: celery -A todolist_dj_aiogram worker -l info
    volumes:
      - .:/app/
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
      - TZ=America/Adak
    depends_on:
      - redis
      - web

  celery-beat:
    build: .
    entrypoint: ["/app/wait_for_migrations.sh"]
    command: celery -A todolist_dj_aiogram beat -l info
    volumes:
      - .:/app/
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
      - TZ=America/Adak
    depends_on:
      - redis
      - web

  migrate:
    build: .
    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate --noinput
      "
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data: